name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar el sitio estático
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # Conserva .nojekyll (.git y .github se excluyen siempre).
          include-hidden-files: true

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
